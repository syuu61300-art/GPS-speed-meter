<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*{box-sizing:border-box}body{margin:0;font-size:14px}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>GPS スピードメーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#0d1014; --panel:#151a20; --line:#262e38; --fg:#e9edf2; --dim:#7f8b99;
  --accent:#ffb020; --cool:#4fd1c5; --hot:#ff5a4e; --pred:#a78bfa;
  --f-display:"Oxanium","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Noto Sans JP",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 24px;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-family:var(--f-display);font-size:1rem;letter-spacing:.12em;font-weight:600;margin:0;text-transform:uppercase}
.status{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.75rem;color:var(--dim);text-align:right}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.ok{background:var(--cool);box-shadow:0 0 8px var(--cool)}
.dot.warn{background:var(--accent)} .dot.err{background:var(--hot)}
.dot.pred{background:var(--pred);box-shadow:0 0 8px var(--pred);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.gauge{position:relative;width:100%;max-width:100%;aspect-ratio:1/0.78}
.gauge canvas{width:100%;height:100%;display:block}
.readout{position:absolute;left:0;right:0;top:46%;text-align:center;transform:translateY(-50%)}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(4rem,22vw,7.5rem);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.readout.predicting .big{color:var(--pred)}
.badge{display:inline-block;font-family:var(--f-body);font-size:.7rem;font-weight:700;letter-spacing:.06em;color:var(--bg);background:var(--pred);border-radius:4px;padding:2px 8px;margin-bottom:6px}
.unit{font-family:var(--f-mono);font-size:.85rem;color:var(--dim);letter-spacing:.2em;margin-top:4px}
.acc{font-family:var(--f-mono);font-size:.7rem;color:var(--dim);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--panel);padding:12px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .k{font-size:.7rem;color:var(--dim);letter-spacing:.08em}
.stat .v{font-family:var(--f-display);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat .v small{font-family:var(--f-mono);font-size:.65rem;color:var(--dim);margin-left:3px;font-weight:400}
.stat.max .v{color:var(--hot)} .stat.avg .v{color:var(--cool)}
.sub{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font-family:var(--f-mono);font-size:.72rem;color:var(--dim)}
.sub > div{min-width:0}
.sub b{display:block;color:var(--fg);font-weight:600;font-size:.92rem;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:400px){.sub{grid-template-columns:repeat(2,1fr)}}
.trace{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 10px 6px}
.trace .k{font-size:.7rem;color:var(--dim);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.legend{display:flex;gap:10px}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid var(--accent);vertical-align:middle;margin-right:4px}
.legend i.p{border-top:2px dashed var(--pred)}
.trace canvas{width:100%;height:90px;display:block;margin-top:6px}
.controls{display:flex;flex-wrap:wrap;gap:8px}
button{font-family:var(--f-body);font-size:.9rem;font-weight:500;border-radius:8px;padding:11px 16px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);color:var(--fg);flex:1 1 auto}
button.primary{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:700}
button:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.note{font-size:.75rem;color:var(--dim);line-height:1.7;margin:0}
.msg{font-size:.8rem;line-height:1.6;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);margin:0}
.msg.err{border-color:var(--hot)}
.msg.good{border-color:var(--cool)}
/* 超ミニマップ（画面右下に固定、タップで拡大） */
.wrap{padding-bottom:120px}
.minimap{position:fixed;z-index:20;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));
  width:92px;height:92px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel);
  box-shadow:0 6px 20px rgba(0,0,0,.45);cursor:pointer;transition:width .2s,height .2s}
.minimap.big{width:min(300px,calc(100vw - 32px));height:min(300px,calc(100vw - 32px))}
.minimap.pred{border-color:var(--pred)}
.minimap canvas{width:100%;height:100%;display:block}
.minimap:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
.minimap .attr{position:absolute;left:0;right:0;bottom:0;font-size:8px;line-height:1.4;padding:1px 4px;color:var(--dim);background:rgba(13,16,20,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minimap .mtag{position:absolute;top:4px;left:4px;font-size:9px;font-weight:700;color:var(--bg);background:var(--pred);border-radius:3px;padding:0 4px}
@media (prefers-reduced-motion:reduce){.dot.pred{animation:none}.minimap{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Speed · GPS</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">待機中</span></div>
  </header>
  <div class="gauge">
    <canvas id="gauge"></canvas>
    <div class="readout" id="readout">
      <span class="badge" id="predBadge" hidden>トンネル予測中</span>
      <div class="big" id="speed">0</div>
      <div class="unit" id="unitLabel">KM/H</div>
      <div class="acc" id="acc">精度 —</div>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><span class="k">現在</span><span class="v" id="cur">0.0<small>km/h</small></span></div>
    <div class="stat avg"><span class="k">平均（移動中）</span><span class="v" id="avg">0.0<small>km/h</small></span></div>
    <div class="stat max"><span class="k">最高（実測）</span><span class="v" id="max">0.0<small>km/h</small></span></div>
  </div>
  <div class="sub">
    <div>距離<b id="dist">0.00 km</b></div>
    <div>経過時間<b id="time">00:00:00</b></div>
    <div>全体平均<b id="avgAll">0.0</b></div>
    <div>トンネル<b id="tunnels">0回</b></div>
  </div>
  <div class="trace">
    <div class="k"><span>速度の推移（直近2分）</span><span class="legend"><span><i></i>実測</span><span><i class="p"></i>予測</span></span><span id="hz">更新 — Hz</span></div>
    <canvas id="trace"></canvas>
  </div>
  <p class="msg" id="msg" hidden></p>
  <div class="controls">
    <button class="primary" id="startBtn">計測開始</button>
    <button id="resetBtn">リセット</button>
    <button id="unitBtn">km/h ⇄ mph</button>
    <button id="demoBtn" aria-pressed="false">デモ走行</button>
  </div>
  <p class="note">GPSが3秒以上途切れると、直前の速度と加速の傾向から速度と距離を予測します（紫色）。GPSが戻ると自動で実測に切り替わり、トンネル区間の距離は出口の位置から計算し直します。最高速度は実測値だけで記録します。右下のミニマップは予測中も推定位置で動き続けます（タップで拡大）。</p>
</div>
<div class="minimap" id="minimap" role="button" tabindex="0" aria-label="ミニマップ（タップで拡大）" aria-expanded="false">
  <canvas id="mapCanvas"></canvas>
  <span class="mtag" id="mapTag" hidden>予測位置</span>
  <span class="attr" id="mapAttr">© OpenStreetMap</span>
</div>
<script>
(() => {
const $ = id => document.getElementById(id);
const KMH = 3.6, MPH = 2.236936;
const GAP_PRED = 3;       // 秒: これ以上途切れたら予測開始
const GAP_RESTART = 15;   // 秒: これ以上途切れたらGPSを再起動して再捕捉を促す
const PRED_LIMIT = 900;   // 秒: 予測の上限（15分）
let unitMph = false;
try { unitMph = localStorage.getItem('unit') === 'mph'; } catch(e){}

const S = { watchId:null, demoTimer:null, running:false, last:null, curMs:0, maxMs:0,
  dist:0, predDist:0, movingTime:0, startT:null, history:[], fixTimes:[], lastFixWall:null,
  predicting:false, pred:null, tunnels:0, lastRestart:0, lastPredPush:0, heading:null, track:[] };
let displayMs = 0;

const conv = ms => ms * (unitMph ? MPH : KMH);
const uname = () => unitMph ? 'mph' : 'km/h';
const SCALES_KMH=[[180,20],[240,30],[320,40],[400,50]], SCALES_MPH=[[120,10],[160,20],[200,20],[260,20]];
function scale(){ const list=unitMph?SCALES_MPH:SCALES_KMH; const need=Math.max(conv(S.maxMs),conv(S.curMs))*1.05;
  return list.find(s=>s[0]>=need)||list[list.length-1]; }
const gaugeMax = () => scale()[0];

function hav(a,b){
  const R=6371000, r=Math.PI/180;
  const dLat=(b.lat-a.lat)*r, dLon=(b.lon-a.lon)*r;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function setStatus(kind, text){ $('dot').className='dot '+(kind||''); $('statusText').textContent=text; }
function showMsg(text, kind){ const m=$('msg'); m.textContent=text; m.className='msg'+(kind?' '+kind:''); m.hidden=!text; }
function fmtTime(sec){
  sec=Math.max(0,Math.floor(sec));
  const h=String(Math.floor(sec/3600)).padStart(2,'0'), m=String(Math.floor(sec%3600/60)).padStart(2,'0'), s=String(sec%60).padStart(2,'0');
  return `${h}:${m}:${s}`;
}

// ---------- 予測（デッドレコニング） ----------
// 直近6秒の実測から加速度を推定し、時間とともに加速度を弱めながら速度を外挿する
function startPrediction(){
  const real = S.history.filter(p=>!p.pred);
  const lastT = real.length ? real[real.length-1].t : 0;
  const win = real.filter(p => p.t >= lastT - 6000);
  let a = 0;
  if (win.length >= 2){
    const f=win[0], l=win[win.length-1], dt=(l.t-f.t)/1000;
    if (dt > 0.5) a = (l.v - f.v)/dt;
  }
  a = Math.max(-1.2, Math.min(1.2, a)); // 新幹線の加減速は概ね±1m/s²以内
  S.pred = { v0:S.curMs, a, tau:8, t0:S.lastFixWall };
  S.predicting = true; S.tunnels++;
  $('predBadge').hidden = false; $('readout').classList.add('predicting');
  showMsg('');
}
function predSpeed(nowWall){
  const t = (nowWall - S.pred.t0)/1000;
  const p = S.pred;
  return Math.max(0, p.v0 + p.a * p.tau * (1 - Math.exp(-t / p.tau)));
}
function endPrediction(){
  if (!S.predicting) return;
  S.predicting = false; S.pred = null;
  $('predBadge').hidden = true; $('readout').classList.remove('predicting');
}

// ---------- 実測の受信 ----------
function onFix(lat, lon, speedMs, accuracy, t, headingDeg){
  const nowWall = performance.now();
  const wasPredicting = S.predicting;
  const gapSec = S.lastFixWall ? (nowWall - S.lastFixWall)/1000 : 0;
  const p = {lat, lon, t};
  if (S.startT === null) S.startT = t;
  let v = (typeof speedMs === 'number' && speedMs >= 0 && !isNaN(speedMs)) ? speedMs : null;
  if (S.last){
    const dt = (t - S.last.t)/1000;
    if (dt > 0){
      const d = hav(S.last, p);
      const ok = !(accuracy && d < accuracy*0.5 && (v===null || v < 0.4));
      if (v === null) v = ok ? d/dt : 0;
      // トンネル区間は入口〜出口の位置から実距離を確定（予測距離は破棄）
      if (ok && d/dt < 120) S.dist += d;
      if (d/dt > 0.42) S.movingTime += dt;
      // 進行方向：GPSの方位を優先、なければ前回位置からの方位
      if (typeof headingDeg === 'number' && !isNaN(headingDeg) && (v||0) > 1) S.heading = headingDeg;
      else if (d > 8) S.heading = bearing(S.last, p);
    }
  }
  S.track.push({lat, lon, gap:wasPredicting});
  if (S.track.length > 3000) S.track.shift();
  S.predDist = 0;
  if (v === null) v = 0;
  if (v < 0.25) v = 0;
  S.curMs = v;
  if (v > S.maxMs) S.maxMs = v;
  S.last = p;
  S.history.push({t, v, pred:false});
  trimHistory(t);
  S.lastFixWall = nowWall;
  S.fixTimes.push(nowWall);
  if (S.fixTimes.length > 10) S.fixTimes.shift();
  $('acc').textContent = accuracy ? `精度 ±${Math.round(accuracy)} m` : '精度 —';
  prefetchTiles();
  if (wasPredicting){
    endPrediction();
    S.fixTimes = [nowWall];
    showMsg(`GPS復帰。${Math.round(gapSec)}秒間の予測区間を実測で補正しました。`, 'good');
    setTimeout(()=>{ if(!S.predicting && $('msg').classList.contains('good')) showMsg(''); }, 5000);
  }
  renderStats();
}
function trimHistory(t){
  const cut = t - 120000;
  while (S.history.length && S.history[0].t < cut) S.history.shift();
}

function renderStats(){
  const u = `<small>${uname()}</small>`;
  $('cur').innerHTML = conv(S.curMs).toFixed(1)+u;
  const avgMoving = S.movingTime > 0 ? S.dist / S.movingTime : 0;
  $('avg').innerHTML = conv(avgMoving).toFixed(1)+u;
  $('max').innerHTML = conv(S.maxMs).toFixed(1)+u;
  const dTot = S.dist + S.predDist;
  $('dist').textContent = unitMph ? (dTot/1609.344).toFixed(2)+' mi' : (dTot/1000).toFixed(2)+' km';
  const el = S.startT && S.last ? (S.last.t - S.startT)/1000 : 0;
  $('avgAll').textContent = (el>0 ? conv(S.dist/el) : 0).toFixed(1);
  $('unitLabel').textContent = unitMph ? 'MPH' : 'KM/H';
  $('tunnels').textContent = S.tunnels + '回';
  if (S.fixTimes.length > 1){
    const span = (S.fixTimes[S.fixTimes.length-1]-S.fixTimes[0])/1000;
    $('hz').textContent = `更新 ${((S.fixTimes.length-1)/span).toFixed(1)} Hz`;
  }
}

// ---------- 描画 ----------
const gc = $('gauge'), tc = $('trace');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function fit(c){ const r=c.getBoundingClientRect(), d=window.devicePixelRatio||1;
  if (c.width!==Math.round(r.width*d)||c.height!==Math.round(r.height*d)){c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);}
  const x=c.getContext('2d'); x.setTransform(d,0,0,d,0,0); return [x,r.width,r.height]; }
const A0 = Math.PI*0.8, A1 = Math.PI*2.2;
function drawGauge(){
  const [x,w,h] = fit(gc); x.clearRect(0,0,w,h);
  const cx=w/2, cy=h*0.58, R=Math.min(w*0.46,h*0.56);
  const mx=gaugeMax(), val=Math.min(conv(displayMs),mx), maxV=Math.min(conv(S.maxMs),mx);
  const ang = v => A0 + (A1-A0)*(v/mx);
  x.lineCap='round'; x.lineWidth=R*0.07; x.strokeStyle=css('--line');
  x.beginPath(); x.arc(cx,cy,R,A0,A1); x.stroke();
  if (S.predicting){ x.strokeStyle=css('--pred'); }
  else { const g=x.createLinearGradient(cx-R,0,cx+R,0);
    g.addColorStop(0,css('--cool')); g.addColorStop(.6,css('--accent')); g.addColorStop(1,css('--hot')); x.strokeStyle=g; }
  x.beginPath(); x.arc(cx,cy,R,A0,ang(val)+0.0001); x.stroke();
  const step = scale()[1];
  x.font=`500 ${Math.max(10,R*0.075)}px "JetBrains Mono", monospace`; x.textAlign='center'; x.textBaseline='middle';
  for (let v=0; v<=mx; v+=step/2){
    const a=ang(v), major = v%step===0;
    const r1=R*0.86, r2=R*(major?0.76:0.81);
    x.strokeStyle= major?css('--fg'):css('--dim'); x.lineWidth=major?2:1;
    x.beginPath(); x.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1); x.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2); x.stroke();
    if (major){ x.fillStyle=css('--dim'); x.fillText(String(v), cx+Math.cos(a)*R*0.66, cy+Math.sin(a)*R*0.66); }
  }
  if (maxV>0){ const a=ang(maxV); x.fillStyle=css('--hot');
    x.beginPath(); x.arc(cx+Math.cos(a)*R, cy+Math.sin(a)*R, R*0.045, 0, Math.PI*2); x.fill(); }
  const a=ang(val); x.fillStyle=css('--fg');
  x.beginPath(); x.arc(cx+Math.cos(a)*R, cy+Math.sin(a)*R, R*0.035, 0, Math.PI*2); x.fill();
}
function drawTrace(){
  const [x,w,h] = fit(tc); x.clearRect(0,0,w,h);
  const pts = S.history;
  const now = pts.length ? pts[pts.length-1].t : Date.now(), t0 = now-120000;
  const top = Math.max(10, Math.ceil(Math.max(conv(S.maxMs), conv(S.curMs))/10)*10);
  const pad=26;
  x.strokeStyle=css('--line'); x.lineWidth=1; x.font='10px "JetBrains Mono", monospace'; x.fillStyle=css('--dim'); x.textAlign='left'; x.textBaseline='middle';
  [0,.5,1].forEach(f=>{ const y=h-5-(h-12)*f; x.beginPath(); x.moveTo(pad,y); x.lineTo(w,y); x.stroke(); x.fillText(String(Math.round(top*f)),0,y); });
  if (pts.length<2) return;
  const X=t=>pad+(w-pad)*((t-t0)/120000), Y=v=>h-5-(h-12)*(conv(v)/top);
  x.beginPath(); pts.forEach((p,i)=> i?x.lineTo(X(p.t),Y(p.v)):x.moveTo(X(p.t),Y(p.v)));
  x.lineTo(X(pts[pts.length-1].t),h-5); x.lineTo(X(pts[0].t),h-5); x.closePath();
  x.fillStyle='rgba(255,176,32,.12)'; x.fill();
  x.lineWidth=2;
  for (let i=1;i<pts.length;i++){
    const a=pts[i-1], b=pts[i], pr=a.pred||b.pred;
    x.strokeStyle = pr ? css('--pred') : css('--accent');
    x.setLineDash(pr ? [4,4] : []);
    x.beginPath(); x.moveTo(X(a.t),Y(a.v)); x.lineTo(X(b.t),Y(b.v)); x.stroke();
  }
  x.setLineDash([]);
  const e=pts[pts.length-1]; x.fillStyle= e.pred?css('--pred'):css('--accent'); x.beginPath(); x.arc(X(e.t),Y(e.v),3.5,0,Math.PI*2); x.fill();
}

// ---------- 超ミニマップ ----------
const mm = $('minimap'), mc = $('mapCanvas');
let mapBig = false;
function toggleMap(){ mapBig=!mapBig; mm.classList.toggle('big',mapBig); mm.setAttribute('aria-expanded',String(mapBig));
  $('mapAttr').textContent = mapBig ? '© OpenStreetMap contributors' : '© OpenStreetMap'; }
mm.addEventListener('click', toggleMap);
mm.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleMap(); } });

const tiles = new Map();
function tile(z,x,y){
  const n=2**z; x=((x%n)+n)%n; if (y<0||y>=n) return null;
  const k=z+'/'+x+'/'+y; let t=tiles.get(k);
  if (!t){
    const img=new Image(); t={img, ok:false};
    img.onload=()=>{ t.ok=true; };
    img.onerror=()=>{ setTimeout(()=>tiles.delete(k), 15000); }; // 圏外なら後で再試行
    img.src=`https://tile.openstreetmap.org/${k}.png`;
    tiles.set(k,t);
    if (tiles.size>400) tiles.delete(tiles.keys().next().value);
  }
  return t;
}
function proj(lat,lon,z){ const s=256*2**z, r=lat*Math.PI/180;
  return {x:(lon+180)/360*s, y:(1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*s}; }
function movePos(p,dist,hdg){ const r=hdg*Math.PI/180;
  return {lat:p.lat+dist*Math.cos(r)/111320, lon:p.lon+dist*Math.sin(r)/(111320*Math.cos(p.lat*Math.PI/180))}; }
function bearing(a,b){ const r=Math.PI/180;
  const y=Math.sin((b.lon-a.lon)*r)*Math.cos(b.lat*r);
  const x=Math.cos(a.lat*r)*Math.sin(b.lat*r)-Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lon-a.lon)*r);
  return (Math.atan2(y,x)/r+360)%360; }
// 表示位置：GPS受信中は最後の位置から速度×経過時間で滑らかに進め、予測中は予測距離ぶん進める
function currentPos(now){
  if (!S.last) return null;
  if (S.heading==null) return {lat:S.last.lat, lon:S.last.lon};
  const extra = S.predicting ? S.predDist : Math.min(1.2,(now-S.lastFixWall)/1000)*S.curMs;
  return movePos(S.last, extra, S.heading);
}
// 圏外になる前に、進行方向の先の地図を読み込んでおく
function prefetchTiles(){
  if (!S.last || S.heading==null) return;
  [13,14].forEach(z=>{ for (const d of [0,1500,3000,5000,8000]){
    const p=movePos(S.last,d,S.heading), q=proj(p.lat,p.lon,z); tile(z,Math.floor(q.x/256),Math.floor(q.y/256)); } });
}
const canFilter = (()=>{ try{ const c=document.createElement('canvas').getContext('2d'); return !!c && 'filter' in c; }catch(e){ return false; } })();
function drawMap(now){
  const [x,w,h]=fit(mc);
  x.fillStyle=css('--panel'); x.fillRect(0,0,w,h);
  mm.classList.toggle('pred', S.predicting); $('mapTag').hidden = !S.predicting;
  const pos=currentPos(now);
  if (!pos){
    x.fillStyle=css('--dim'); x.font='10px "Noto Sans JP", sans-serif'; x.textAlign='center'; x.textBaseline='middle';
    x.fillText('現在地待ち', w/2, h/2-4); return;
  }
  const z = mapBig ? 14 : 13;
  const c=proj(pos.lat,pos.lon,z), ox=c.x-w/2, oy=c.y-h/2;
  // 地図が読めないとき用の方眼（移動が見えるよう地図座標に固定）
  x.strokeStyle=css('--line'); x.lineWidth=1; const g=24;
  for (let gx=-(((ox%g)+g)%g); gx<w; gx+=g){ x.beginPath(); x.moveTo(gx,0); x.lineTo(gx,h); x.stroke(); }
  for (let gy=-(((oy%g)+g)%g); gy<h; gy+=g){ x.beginPath(); x.moveTo(0,gy); x.lineTo(w,gy); x.stroke(); }
  // 地図タイル（ダークに変換）
  if (canFilter) x.filter='invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.5)'; else x.globalAlpha=.5;
  for (let ty=Math.floor(oy/256); ty<=Math.floor((oy+h)/256); ty++)
    for (let tx=Math.floor(ox/256); tx<=Math.floor((ox+w)/256); tx++){
      const t=tile(z,tx,ty); if (t && t.ok) x.drawImage(t.img, tx*256-ox, ty*256-oy, 256, 256); }
  x.filter='none'; x.globalAlpha=1;
  // 走行軌跡（実測＝橙、トンネル区間＝紫の点線）
  const P=p=>{ const q=proj(p.lat,p.lon,z); return [q.x-ox, q.y-oy]; };
  const tr=S.track.slice(-800);
  x.lineWidth=2.5; x.lineCap='round'; x.lineJoin='round';
  for (let i=1;i<tr.length;i++){
    const a=P(tr[i-1]), b=P(tr[i]);
    if ((a[0]<-50&&b[0]<-50)||(a[0]>w+50&&b[0]>w+50)||(a[1]<-50&&b[1]<-50)||(a[1]>h+50&&b[1]>h+50)) continue;
    x.strokeStyle = tr[i].gap ? css('--pred') : css('--accent'); x.setLineDash(tr[i].gap?[3,3]:[]);
    x.beginPath(); x.moveTo(a[0],a[1]); x.lineTo(b[0],b[1]); x.stroke();
  }
  if (S.predicting){ const a=P(S.last); x.strokeStyle=css('--pred'); x.setLineDash([3,3]);
    x.beginPath(); x.moveTo(a[0],a[1]); x.lineTo(w/2,h/2); x.stroke(); }
  x.setLineDash([]);
  // 現在地マーカー（北が上、矢印は進行方向）
  x.save(); x.translate(w/2,h/2);
  x.fillStyle = S.predicting ? css('--pred') : css('--cool'); x.strokeStyle=css('--bg'); x.lineWidth=2;
  if (S.heading==null){ x.beginPath(); x.arc(0,0,5,0,Math.PI*2); x.fill(); x.stroke(); }
  else { x.rotate(S.heading*Math.PI/180); x.beginPath(); x.moveTo(0,-9); x.lineTo(6.5,7); x.lineTo(0,3.5); x.lineTo(-6.5,7); x.closePath(); x.fill(); x.stroke(); }
  x.restore();
}

// ---------- メインループ（60fps） ----------
let lastFrame = performance.now();
function frame(now){
  const dt=Math.min(0.25,(now-lastFrame)/1000); lastFrame=now;
  const active = S.watchId!==null || S.demoTimer!==null;
  if (active && S.lastFixWall){
    const gap=(now-S.lastFixWall)/1000;
    if (gap > GAP_PRED && !S.predicting && S.curMs > 0.5) startPrediction();
    if (S.predicting){
      if (gap > PRED_LIMIT){ S.curMs = 0; }
      else { S.curMs = predSpeed(now); S.predDist += S.curMs*dt; }
      setStatus('pred', `トンネル予測 ${Math.floor(gap)}秒`);
      if (now - S.lastPredPush > 1000){
        S.lastPredPush = now;
        const tt = S.last.t + (now - S.lastFixWall);
        S.history.push({t:tt, v:S.curMs, pred:true}); trimHistory(tt);
        renderStats();
      }
    } else if (gap > GAP_PRED){
      setStatus('warn', `GPS待ち ${Math.floor(gap)}秒`);
    } else {
      setStatus('ok', S.demoTimer ? 'デモ走行中' : 'GPS受信中');
    }
    // 長く途切れたらGPSを再起動して再捕捉を促す（実機のみ）
    if (S.watchId!==null && gap > GAP_RESTART && now - S.lastRestart > GAP_RESTART*1000){
      S.lastRestart = now; restartWatch();
    }
  }
  displayMs += (S.curMs - displayMs) * (1 - Math.exp(-dt*6));
  $('speed').textContent = Math.round(conv(displayMs));
  if (S.running && S.startT){ $('time').textContent=fmtTime((Date.now()-S.startT)/1000); }
  drawGauge(); drawTrace(); drawMap(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- 画面スリープ防止 ----------
let wake=null;
async function keepAwake(){ try{ if('wakeLock' in navigator){ wake=await navigator.wakeLock.request('screen'); } }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && S.running) keepAwake(); });

// ---------- GPS ----------
function onGeoError(err){
  if (err.code===1){
    setStatus('err','エラー');
    showMsg('位置情報の利用が許可されていません。ブラウザの設定で許可してください。','err');
    stopAll();
  }
  // code 2/3（受信不可・タイムアウト）は無視して計測を続ける。予測と自動復帰で対応
}
function watch(){
  return navigator.geolocation.watchPosition(pos=>{
    const c=pos.coords;
    onFix(c.latitude,c.longitude,c.speed,c.accuracy,pos.timestamp||Date.now(),c.heading);
  }, onGeoError, {enableHighAccuracy:true, maximumAge:0, timeout:30000});
}
function restartWatch(){
  try{ if (S.watchId!==null) navigator.geolocation.clearWatch(S.watchId); S.watchId = watch(); }catch(e){}
}
function stopAll(){
  if (S.watchId!==null && navigator.geolocation) navigator.geolocation.clearWatch(S.watchId);
  S.watchId=null; clearInterval(S.demoTimer); S.demoTimer=null; S.running=false;
  endPrediction();
  try{ wake && wake.release(); }catch(e){} wake=null;
  $('startBtn').textContent='計測開始'; $('demoBtn').setAttribute('aria-pressed','false');
}
function startGPS(){
  if (!('geolocation' in navigator)){ showMsg('この環境では位置情報が使えません。','err'); return; }
  stopAll(); S.running=true; $('startBtn').textContent='停止';
  setStatus('warn','GPS取得中…'); showMsg('');
  keepAwake();
  try{ S.watchId = watch(); }
  catch(e){ setStatus('err','エラー'); showMsg('位置情報を開始できませんでした。','err'); stopAll(); }
}

// ---------- デモ（35秒走行 → 12秒トンネル を繰り返す） ----------
function startDemo(){
  stopAll(); S.running=true; $('demoBtn').setAttribute('aria-pressed','true'); $('startBtn').textContent='停止';
  showMsg('デモの値です。35秒ごとに12秒間のトンネルを再現します。');
  let pos={lat:35.6812, lon:139.7671}, t=Date.now(), k=0;
  S.demoTimer=setInterval(()=>{
    k++; t+=1000;
    const kmh = Math.min(285, 60 + k*6) + Math.sin(k/7)*6 + (Math.random()-.5)*3;
    const ms=kmh/3.6, hdg = 225 + 30*Math.sin(k/25);
    pos = movePos(pos, ms, hdg);
    const inTunnel = (k % 47) >= 35;
    if (!inTunnel) onFix(pos.lat,pos.lon,ms,5,t,hdg);
  },1000);
}

$('startBtn').onclick=()=>{ S.running ? (stopAll(), setStatus('','停止中')) : startGPS(); };
$('demoBtn').onclick=()=>{ S.demoTimer ? (stopAll(), setStatus('','停止中'), showMsg('')) : startDemo(); };
$('resetBtn').onclick=()=>{
  endPrediction();
  Object.assign(S,{lastFixWall:null,last:null,curMs:0,maxMs:0,dist:0,predDist:0,movingTime:0,startT:null,history:[],fixTimes:[],tunnels:0,heading:null,track:[]});
  displayMs=0; $('time').textContent='00:00:00'; $('hz').textContent='更新 — Hz'; $('acc').textContent='精度 —'; showMsg(''); renderStats(); };
$('unitBtn').onclick=()=>{ unitMph=!unitMph; try{localStorage.setItem('unit',unitMph?'mph':'kmh');}catch(e){} renderStats(); };
renderStats();
})();
</script>
