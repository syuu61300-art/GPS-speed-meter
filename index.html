<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GPS スピードメーター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#0d1014; --panel:#151a20; --line:#262e38; --fg:#e9edf2; --dim:#7f8b99;
  --accent:#ffb020; --cool:#4fd1c5; --hot:#ff5a4e;
  --f-display:"Oxanium","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Noto Sans JP",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 24px;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-family:var(--f-display);font-size:1rem;letter-spacing:.12em;font-weight:600;margin:0;text-transform:uppercase}
.status{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.75rem;color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.dot.ok{background:var(--cool);box-shadow:0 0 8px var(--cool)}
.dot.warn{background:var(--accent)} .dot.err{background:var(--hot)}
.gauge{position:relative;width:100%;max-width:100%;aspect-ratio:1/0.78}
.gauge canvas{width:100%;height:100%;display:block}
.readout{position:absolute;left:0;right:0;top:46%;text-align:center;transform:translateY(-50%)}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(4rem,22vw,7.5rem);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.unit{font-family:var(--f-mono);font-size:.85rem;color:var(--dim);letter-spacing:.2em;margin-top:4px}
.acc{font-family:var(--f-mono);font-size:.7rem;color:var(--dim);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--panel);padding:12px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .k{font-size:.7rem;color:var(--dim);letter-spacing:.08em}
.stat .v{font-family:var(--f-display);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat .v small{font-family:var(--f-mono);font-size:.65rem;color:var(--dim);margin-left:3px;font-weight:400}
.stat.max .v{color:var(--hot)} .stat.avg .v{color:var(--cool)}
.sub{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-family:var(--f-mono);font-size:.75rem;color:var(--dim)}
.sub b{display:block;color:var(--fg);font-weight:600;font-size:.95rem;font-variant-numeric:tabular-nums}
.trace{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 10px 6px}
.trace .k{font-size:.7rem;color:var(--dim);display:flex;justify-content:space-between}
.trace canvas{width:100%;height:90px;display:block;margin-top:6px}
.controls{display:flex;flex-wrap:wrap;gap:8px}
button{font-family:var(--f-body);font-size:.9rem;font-weight:500;border-radius:8px;padding:11px 16px;cursor:pointer;
  border:1px solid var(--line);background:var(--panel);color:var(--fg);flex:1 1 auto}
button.primary{background:var(--accent);color:#1a1200;border-color:var(--accent);font-weight:700}
button:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.note{font-size:.75rem;color:var(--dim);line-height:1.7;margin:0}
.msg{font-size:.8rem;line-height:1.6;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);margin:0}
.msg.err{border-color:var(--hot)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Speed · GPS</h1>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">待機中</span></div>
  </header>
  <div class="gauge">
    <canvas id="gauge"></canvas>
    <div class="readout">
      <div class="big" id="speed">0</div>
      <div class="unit" id="unitLabel">KM/H</div>
      <div class="acc" id="acc">精度 —</div>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><span class="k">現在</span><span class="v" id="cur">0.0<small>km/h</small></span></div>
    <div class="stat avg"><span class="k">平均（移動中）</span><span class="v" id="avg">0.0<small>km/h</small></span></div>
    <div class="stat max"><span class="k">最高</span><span class="v" id="max">0.0<small>km/h</small></span></div>
  </div>
  <div class="sub">
    <div>距離<b id="dist">0.00 km</b></div>
    <div>経過時間<b id="time">00:00:00</b></div>
    <div>全体平均<b id="avgAll">0.0</b></div>
  </div>
  <div class="trace">
    <div class="k"><span>速度の推移（直近2分）</span><span id="hz">更新 — Hz</span></div>
    <canvas id="trace"></canvas>
  </div>
  <p class="msg" id="msg" hidden></p>
  <div class="controls">
    <button class="primary" id="startBtn">計測開始</button>
    <button id="resetBtn">リセット</button>
    <button id="unitBtn">km/h ⇄ mph</button>
    <button id="demoBtn" aria-pressed="false">デモ走行</button>
  </div>
  <p class="note">GPSの速度値を優先し、取れない端末では位置の変化から計算します。針は60fpsで補間して滑らかに動きます。GPS自体の更新は多くのスマホで毎秒1回前後です。平均は時速1.5km以上で動いている時間だけで計算します。</p>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const KMH = 3.6, MPH = 2.236936;
let unitMph = false;
try { unitMph = localStorage.getItem('unit') === 'mph'; } catch(e){}

const S = { watchId:null, demoTimer:null, running:false, last:null, curMs:0, maxMs:0,
  dist:0, movingTime:0, startT:null, history:[], fixTimes:[] };
let displayMs = 0;

const conv = ms => ms * (unitMph ? MPH : KMH);
const uname = () => unitMph ? 'mph' : 'km/h';
const gaugeMax = () => unitMph ? 120 : 180;

function hav(a,b){
  const R=6371000, r=Math.PI/180;
  const dLat=(b.lat-a.lat)*r, dLon=(b.lon-a.lon)*r;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function setStatus(kind, text){ $('dot').className='dot '+(kind||''); $('statusText').textContent=text; }
function showMsg(text, err){ const m=$('msg'); m.textContent=text; m.className='msg'+(err?' err':''); m.hidden=!text; }

function onFix(lat, lon, speedMs, accuracy, t){
  const p = {lat, lon, t};
  if (S.startT === null) S.startT = t;
  let v = (typeof speedMs === 'number' && speedMs >= 0 && !isNaN(speedMs)) ? speedMs : null;
  if (S.last){
    const dt = (t - S.last.t)/1000;
    if (dt > 0){
      const d = hav(S.last, p);
      const ok = !(accuracy && d < accuracy*0.5 && (v===null || v < 0.4));
      if (v === null) v = ok ? d/dt : 0;
      if (ok && v < 120) S.dist += d;
      if (v > 0.42) S.movingTime += dt;
    }
  }
  if (v === null) v = 0;
  if (v < 0.25) v = 0;
  S.curMs = v;
  if (v > S.maxMs) S.maxMs = v;
  S.last = p;
  S.history.push({t, v});
  const cut = t - 120000;
  while (S.history.length && S.history[0].t < cut) S.history.shift();
  S.fixTimes.push(performance.now());
  if (S.fixTimes.length > 10) S.fixTimes.shift();
  $('acc').textContent = accuracy ? `精度 ±${Math.round(accuracy)} m` : '精度 —';
  renderStats();
}
function fmtTime(sec){
  sec=Math.max(0,Math.floor(sec));
  const h=String(Math.floor(sec/3600)).padStart(2,'0'), m=String(Math.floor(sec%3600/60)).padStart(2,'0'), s=String(sec%60).padStart(2,'0');
  return `${h}:${m}:${s}`;
}
function renderStats(){
  const u = `<small>${uname()}</small>`;
  $('cur').innerHTML = conv(S.curMs).toFixed(1)+u;
  const avgMoving = S.movingTime > 0 ? S.dist / S.movingTime : 0;
  $('avg').innerHTML = conv(avgMoving).toFixed(1)+u;
  $('max').innerHTML = conv(S.maxMs).toFixed(1)+u;
  $('dist').textContent = unitMph ? (S.dist/1609.344).toFixed(2)+' mi' : (S.dist/1000).toFixed(2)+' km';
  const el = S.startT && S.last ? (S.last.t - S.startT)/1000 : 0;
  $('avgAll').textContent = (el>0 ? conv(S.dist/el) : 0).toFixed(1);
  $('unitLabel').textContent = unitMph ? 'MPH' : 'KM/H';
  if (S.fixTimes.length > 1){
    const span = (S.fixTimes[S.fixTimes.length-1]-S.fixTimes[0])/1000;
    $('hz').textContent = `更新 ${((S.fixTimes.length-1)/span).toFixed(1)} Hz`;
  }
}

const gc = $('gauge'), tc = $('trace');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function fit(c){ const r=c.getBoundingClientRect(), d=window.devicePixelRatio||1;
  if (c.width!==Math.round(r.width*d)||c.height!==Math.round(r.height*d)){c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);}
  const x=c.getContext('2d'); x.setTransform(d,0,0,d,0,0); return [x,r.width,r.height]; }

const A0 = Math.PI*0.8, A1 = Math.PI*2.2;
function drawGauge(){
  const [x,w,h] = fit(gc); x.clearRect(0,0,w,h);
  const cx=w/2, cy=h*0.58, R=Math.min(w*0.46,h*0.56);
  const mx=gaugeMax(), val=Math.min(conv(displayMs),mx), maxV=Math.min(conv(S.maxMs),mx);
  const ang = v => A0 + (A1-A0)*(v/mx);
  x.lineCap='round'; x.lineWidth=R*0.07; x.strokeStyle=css('--line');
  x.beginPath(); x.arc(cx,cy,R,A0,A1); x.stroke();
  const g=x.createLinearGradient(cx-R,0,cx+R,0);
  g.addColorStop(0,css('--cool')); g.addColorStop(.6,css('--accent')); g.addColorStop(1,css('--hot'));
  x.strokeStyle=g; x.beginPath(); x.arc(cx,cy,R,A0,ang(val)+0.0001); x.stroke();
  const step = unitMph ? 10 : 20;
  x.font=`500 ${Math.max(10,R*0.075)}px "JetBrains Mono", monospace`; x.textAlign='center'; x.textBaseline='middle';
  for (let v=0; v<=mx; v+=step/2){
    const a=ang(v), major = v%step===0;
    const r1=R*0.86, r2=R*(major?0.76:0.81);
    x.strokeStyle= major?css('--fg'):css('--dim'); x.lineWidth=major?2:1;
    x.beginPath(); x.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1); x.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2); x.stroke();
    if (major){ x.fillStyle=css('--dim'); x.fillText(String(v), cx+Math.cos(a)*R*0.66, cy+Math.sin(a)*R*0.66); }
  }
  if (maxV>0){ const a=ang(maxV); x.fillStyle=css('--hot');
    x.beginPath(); x.arc(cx+Math.cos(a)*R, cy+Math.sin(a)*R, R*0.045, 0, Math.PI*2); x.fill(); }
  const a=ang(val); x.fillStyle=css('--fg');
  x.beginPath(); x.arc(cx+Math.cos(a)*R, cy+Math.sin(a)*R, R*0.035, 0, Math.PI*2); x.fill();
}
function drawTrace(){
  const [x,w,h] = fit(tc); x.clearRect(0,0,w,h);
  const now = S.last ? S.last.t : Date.now(), t0 = now-120000;
  const pts = S.history; const top = Math.max(10, Math.ceil(conv(S.maxMs)/10)*10);
  const pad=22;
  x.strokeStyle=css('--line'); x.lineWidth=1; x.font='10px "JetBrains Mono", monospace'; x.fillStyle=css('--dim'); x.textAlign='left'; x.textBaseline='middle';
  [0,.5,1].forEach(f=>{ const y=h-4-(h-12)*f; x.beginPath(); x.moveTo(pad,y); x.lineTo(w,y); x.stroke(); x.fillText(String(Math.round(top*f)),0,y); });
  if (pts.length<2) return;
  const X=t=>pad+(w-pad)*((t-t0)/120000), Y=v=>h-4-(h-12)*(conv(v)/top);
  x.beginPath(); pts.forEach((p,i)=> i?x.lineTo(X(p.t),Y(p.v)):x.moveTo(X(p.t),Y(p.v)));
  x.lineTo(X(pts[pts.length-1].t),h-4); x.lineTo(X(pts[0].t),h-4); x.closePath();
  x.fillStyle='rgba(255,176,32,.14)'; x.fill();
  x.beginPath(); pts.forEach((p,i)=> i?x.lineTo(X(p.t),Y(p.v)):x.moveTo(X(p.t),Y(p.v)));
  x.strokeStyle=css('--accent'); x.lineWidth=2; x.stroke();
  const e=pts[pts.length-1]; x.fillStyle=css('--accent'); x.beginPath(); x.arc(X(e.t),Y(e.v),3.5,0,Math.PI*2); x.fill();
}

let lastFrame = performance.now();
function frame(now){
  const dt=(now-lastFrame)/1000; lastFrame=now;
  displayMs += (S.curMs - displayMs) * (1 - Math.exp(-dt*6));
  $('speed').textContent = Math.round(conv(displayMs));
  if (S.running && S.startT){ $('time').textContent=fmtTime((Date.now()-S.startT)/1000); }
  drawGauge(); drawTrace();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

let wake=null;
async function keepAwake(){ try{ if('wakeLock' in navigator){ wake=await navigator.wakeLock.request('screen'); } }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && S.running) keepAwake(); });

function stopAll(){
  if (S.watchId!==null && navigator.geolocation) navigator.geolocation.clearWatch(S.watchId);
  S.watchId=null; clearInterval(S.demoTimer); S.demoTimer=null; S.running=false;
  try{ wake && wake.release(); }catch(e){} wake=null;
  $('startBtn').textContent='計測開始'; $('demoBtn').setAttribute('aria-pressed','false');
}
function startGPS(){
  if (!('geolocation' in navigator)){ showMsg('この環境では位置情報が使えません。',true); return; }
  stopAll(); S.running=true; $('startBtn').textContent='停止';
  setStatus('warn','GPS取得中…'); showMsg('');
  keepAwake();
  try{
    S.watchId = navigator.geolocation.watchPosition(pos=>{
      const c=pos.coords; setStatus('ok','GPS受信中');
      onFix(c.latitude,c.longitude,c.speed,c.accuracy,pos.timestamp||Date.now());
    }, err=>{
      const why = err.code===1 ? '位置情報の利用が許可されていません。ブラウザの設定で許可してください。'
        : err.code===2 ? '位置を取得できません。屋外や窓の近くで試してください。'
        : 'GPSの応答がタイムアウトしました。';
      setStatus('err','エラー'); showMsg(why,true);
      if (err.code===1) stopAll();
    }, {enableHighAccuracy:true, maximumAge:0, timeout:15000});
  }catch(e){ setStatus('err','エラー'); showMsg('位置情報を開始できませんでした。',true); stopAll(); }
}
function startDemo(){
  stopAll(); S.running=true; $('demoBtn').setAttribute('aria-pressed','true'); $('startBtn').textContent='停止';
  setStatus('warn','デモ走行中'); showMsg('デモの値です。実際の速度ではありません。');
  let lat=34.9756, lon=138.3828, t=Date.now(), phase=0;
  S.demoTimer=setInterval(()=>{
    phase+=0.05; t+=1000;
    const kmh=Math.max(0, 45+35*Math.sin(phase)+12*Math.sin(phase*3.1)+(Math.random()-.5)*4);
    const ms=kmh/3.6; lon += ms/(111320*Math.cos(lat*Math.PI/180));
    onFix(lat,lon,ms,5,t);
  },1000);
}

$('startBtn').onclick=()=>{ S.running ? (stopAll(), setStatus('','停止中')) : startGPS(); };
$('demoBtn').onclick=()=>{ S.demoTimer ? (stopAll(), setStatus('','停止中'), showMsg('')) : startDemo(); };
$('resetBtn').onclick=()=>{ Object.assign(S,{last:null,curMs:0,maxMs:0,dist:0,movingTime:0,startT:null,history:[],fixTimes:[]});
  displayMs=0; $('time').textContent='00:00:00'; $('hz').textContent='更新 — Hz'; $('acc').textContent='精度 —'; renderStats(); };
$('unitBtn').onclick=()=>{ unitMph=!unitMph; try{localStorage.setItem('unit',unitMph?'mph':'kmh');}catch(e){} renderStats(); };

renderStats();
})();
</script>
</body>
</html>
